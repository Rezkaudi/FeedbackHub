# The front end and the API on one origin.
#
# This is R-3h, and it is not a convenience: the auth cookies are SameSite, and
# SameSite only means anything if the browser sees the app and the API as the
# same site. Serving the build here and proxying /v1 to the API keeps that true
# in a container the same way the dev server's proxy keeps it true locally.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API. `proxy_set_header Host` is deliberately the original host: the
    # API's Origin check (R-3g) compares against AUTH_ALLOWED_ORIGINS, and
    # rewriting the host here would make every write look cross-site.
    location /v1/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A sign-in redirect must reach the browser, not be followed here.
        proxy_redirect off;
    }

    location /health/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    # Hashed build output never changes under the same name, so it can be kept
    # for a year. index.html must never be cached, or a deploy is invisible
    # until somebody clears their browser.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other address is a route inside the app (R-22 puts the board's
    # filters in the URL, so these are real addresses people share and reload).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
