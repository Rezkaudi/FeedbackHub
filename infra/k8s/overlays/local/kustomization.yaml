# A small local cluster (kind). R-81. Full steps, including the backing services
# this overlay does not carry, are in README.md → "How to run it" → "On
# Kubernetes". Not yet run against a real cluster.
#
#   export KIND_EXPERIMENTAL_PROVIDER=podman
#   kind create cluster --name feedbackhub
#   podman build -t feedbackhub-api:local     -f infra/docker/api/Dockerfile .
#   podman build -t feedbackhub-migrate:local -f infra/docker/api/migrate.Dockerfile .
#   podman save feedbackhub-api:local -o /tmp/fh-api.tar && kind load image-archive /tmp/fh-api.tar --name feedbackhub
#   podman save feedbackhub-migrate:local -o /tmp/fh-migrate.tar && kind load image-archive /tmp/fh-migrate.tar --name feedbackhub
#   kubectl apply -f infra/k8s/base/secret.example.yaml   # local values only
#   kubectl apply -k infra/k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# One replica locally: two is what production wants (R-118), not a laptop.
patches:
  - target: { kind: Deployment, name: feedbackhub-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
