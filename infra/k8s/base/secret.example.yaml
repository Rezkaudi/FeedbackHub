# R-102: no secret is ever put in the repository. This is an EXAMPLE with fake
# values, kept next to the real deployment so nobody has to guess the key names.
#
# Create the real one out of band, and never commit it:
#
#   kubectl create secret generic feedbackhub-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=OIDC_CLIENT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://feedbackhub:feedbackhub@postgres:5432/feedbackhub
  REDIS_URL: redis://redis:6379
  OIDC_CLIENT_SECRET: replace-me-not-a-real-secret
