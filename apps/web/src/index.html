<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>FeedbackHub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      R-56: the theme is read before the first paint, so the next load is right
      with no white flash.

      This is deliberately a blocking inline script and not Angular's job. By the
      time Angular boots, the browser has already painted; anything that reads
      localStorage from a component is one frame too late and the person sees a
      white page flash to dark. Four lines here buy that, and it is the reason
      the app does not need server-side rendering to avoid a flash.

      It writes nothing and reads one key. A missing or damaged value means
      "follow the computer", which is the shipped default.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('fh.theme');
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice);
          }
          var language = localStorage.getItem('fh.language');
          if (language === 'ar') {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
          }
        } catch (error) {
          /* A private window can throw on localStorage. The default is correct. */
        }
      })();
    </script>
  </head>
  <body>
    <fh-root></fh-root>
  </body>
</html>
