@switch (admin.state()) {
  @case ('loading') {
    <fh-skeleton-card [cards]="3" [rows]="2" label="Loading the settings" />
  }
  @case ('failed') {
    <fh-error-panel
      [heading]="'admin.actionFailed' | t"
      [requestId]="admin.error()?.requestId ?? ''"
      [canRetry]="admin.error()?.isRetryable ?? false"
      [retryLabel]="'common.tryAgain' | t"
      (retry)="admin.loadSettings()"
    />
  }
  @case ('ready') {
    @if (admin.settings(); as settings) {
      @if (admin.actionError(); as failure) {
        <p role="alert" data-testid="settings-action-error" class="bg-error-container text-on-error-container mb-6 rounded-lg px-4 py-3">
          {{ failure | apiError: 'admin.actionFailed' }}
        </p>
      }

      <div class="flex max-w-(--fh-measure) flex-col gap-6">
        <fh-registration-card
          [settings]="settings"
          (saved)="onRegistration($event)"
          (touched)="admin.dismissActionError()"
        />
        <fh-comments-card
          [settings]="settings"
          (enabledChanged)="onCommentsEnabled($event)"
          (approvalChanged)="onCommentsApproval($event)"
        />
        <fh-rate-limits-card [settings]="settings" (limitChanged)="onLimit($event)" />
      </div>
    }
  }
}
