<fh-section-card
  [heading]="'admin.rateLimitsSection' | t"
  [detail]="'admin.rateLimitsDetail' | t"
  icon="filter"
>
  <div class="flex flex-col">
    @for (limit of limits; track limit.label) {
      <fieldset class="border-outline-variant border-t py-4 first:border-t-0 first:pt-0">
        <legend class="mb-3 text-sm font-semibold">{{ limit.label | t }}</legend>
        <div class="grid gap-3 sm:grid-cols-2">
          <fh-field [label]="'admin.rateLimitsCount' | t" [fieldId]="limit.countId">
            <input
              [id]="limit.countId"
              type="number"
              min="1"
              inputmode="numeric"
              [value]="value(limit.countId)"
              (change)="onChange(limit.countId, $event)"
              class="fh-input"
            />
          </fh-field>
          <fh-field [label]="'admin.rateLimitsWindow' | t" [fieldId]="limit.minutesId">
            <input
              [id]="limit.minutesId"
              type="number"
              min="1"
              inputmode="numeric"
              [value]="value(limit.minutesId)"
              (change)="onChange(limit.minutesId, $event)"
              class="fh-input"
            />
          </fh-field>
        </div>
      </fieldset>
    }
  </div>

  @if (tooSmall()) {
    <p role="alert" class="text-error text-sm">{{ 'admin.limitTooSmall' | t }}</p>
  }
</fh-section-card>
