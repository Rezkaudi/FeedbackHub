<fh-section-card [heading]="'admin.rateLimitsSection' | t">
  <div class="grid gap-4 sm:grid-cols-2">
    <fh-field [label]="'admin.submissionLimit' | t" fieldId="submissionLimitCount">
      <input
        id="submissionLimitCount"
        type="number"
        min="1"
        [value]="settings().submissionLimitCount"
        (change)="onChange('submissionLimitCount', $event)"
        class="fh-input"
      />
    </fh-field>
    <fh-field [label]="'admin.minutesLabel' | t" fieldId="submissionLimitMinutes">
      <input
        id="submissionLimitMinutes"
        type="number"
        min="1"
        [value]="settings().submissionLimitMinutes"
        (change)="onChange('submissionLimitMinutes', $event)"
        class="fh-input"
      />
    </fh-field>

    <fh-field [label]="'admin.voteLimit' | t" fieldId="voteLimitCount">
      <input
        id="voteLimitCount"
        type="number"
        min="1"
        [value]="settings().voteLimitCount"
        (change)="onChange('voteLimitCount', $event)"
        class="fh-input"
      />
    </fh-field>
    <fh-field [label]="'admin.minutesLabel' | t" fieldId="voteLimitMinutes">
      <input
        id="voteLimitMinutes"
        type="number"
        min="1"
        [value]="settings().voteLimitMinutes"
        (change)="onChange('voteLimitMinutes', $event)"
        class="fh-input"
      />
    </fh-field>

    <fh-field [label]="'admin.signupLimit' | t" fieldId="signupLimitCount">
      <input
        id="signupLimitCount"
        type="number"
        min="1"
        [value]="settings().signupLimitCount"
        (change)="onChange('signupLimitCount', $event)"
        class="fh-input"
      />
    </fh-field>
    <fh-field [label]="'admin.minutesLabel' | t" fieldId="signupLimitMinutes">
      <input
        id="signupLimitMinutes"
        type="number"
        min="1"
        [value]="settings().signupLimitMinutes"
        (change)="onChange('signupLimitMinutes', $event)"
        class="fh-input"
      />
    </fh-field>
  </div>

  @if (tooSmall()) {
    <p role="alert" class="text-error text-sm">{{ 'admin.limitTooSmall' | t }}</p>
  }
</fh-section-card>
