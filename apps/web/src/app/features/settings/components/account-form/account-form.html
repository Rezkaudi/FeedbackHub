<fh-section-card
  [heading]="'settings.accountHeading' | t"
  [detail]="'settings.accountDetail' | t"
  headingId="account-heading"
  icon="mail"
>
  <form class="flex flex-col gap-6" (submit)="save($event)">
    <fh-field [label]="'header.language' | t">
      <fh-segmented-control
        [options]="languageOptions"
        [value]="language()"
        [ariaLabel]="'header.language' | t"
        (valueChange)="onLanguage($event)"
      />
    </fh-field>

    <fieldset class="flex flex-col">
      <legend class="text-on-surface-variant mb-1 text-sm font-semibold">{{ 'settings.emailMe' | t }}</legend>

      <div class="border-outline-variant flex items-start justify-between gap-4 border-t py-3">
        <div class="min-w-0">
          <label for="notify-comment" class="block text-sm font-medium">{{ 'settings.emailOnComment' | t }}</label>
          <p class="text-on-surface-variant mt-0.5 text-xs">{{ 'settings.emailOnCommentHint' | t }}</p>
        </div>
        <fh-switch
          inputId="notify-comment"
          [checked]="notifyOnComment()"
          (toggled)="notifyOnComment.set(!notifyOnComment())"
        />
      </div>

      <div class="border-outline-variant flex items-start justify-between gap-4 border-t py-3">
        <div class="min-w-0">
          <label for="notify-status" class="block text-sm font-medium">{{ 'settings.emailOnStatus' | t }}</label>
          <p class="text-on-surface-variant mt-0.5 text-xs">{{ 'settings.emailOnStatusHint' | t }}</p>
        </div>
        <fh-switch
          inputId="notify-status"
          [checked]="notifyOnStatusChange()"
          (toggled)="notifyOnStatusChange.set(!notifyOnStatusChange())"
        />
      </div>
    </fieldset>

    <div
      class="border-outline-variant -mx-6 mt-1 flex flex-wrap items-center gap-x-4 gap-y-2 border-t px-6 pt-5"
    >
      <fh-button type="submit">{{ 'settings.saveAccount' | t }}</fh-button>
      @if (store.settingsSaved()) {
        <p role="status" class="text-success inline-flex items-center gap-1.5 text-sm">
          <fh-icon name="check-circle" [size]="16" />
          {{ 'common.saved' | t }}
        </p>
      }
      @if (store.settingsError()) {
        <p role="alert" class="text-error inline-flex items-center gap-1.5 text-sm">
          <fh-icon name="alert-circle" [size]="16" />
          {{ 'settings.accountFailed' | t }}
        </p>
      }
    </div>
  </form>
</fh-section-card>
