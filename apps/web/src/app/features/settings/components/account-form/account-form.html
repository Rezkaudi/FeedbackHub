<fh-section-card
  [heading]="'settings.accountHeading' | t"
  [detail]="'settings.accountDetail' | t"
  headingId="account-heading"
  icon="mail"
>
  <div class="flex flex-col gap-6">
    <fh-field [label]="'header.language' | t">
      <fh-segmented-control
        [options]="languageOptions"
        [value]="language()"
        [ariaLabel]="'header.language' | t"
        [testId]="'account-language'"
        (valueChange)="onLanguage($event)"
      />
    </fh-field>

    <fieldset class="flex flex-col">
      <legend class="text-on-surface-variant mb-1 text-sm font-semibold">
        {{ 'settings.emailMe' | t }}
      </legend>

      <div class="border-outline-variant flex items-start justify-between gap-4 border-t py-3">
        <div class="min-w-0">
          <label for="notify-comment" class="block text-sm font-medium">
            {{ 'settings.emailOnComment' | t }}
          </label>
          <p class="text-on-surface-variant mt-0.5 text-xs">{{ 'settings.emailOnCommentHint' | t }}</p>
        </div>
        <fh-switch
          inputId="notify-comment"
          [checked]="notifyOnComment()"
          [testId]="'account-notify-comment'"
          (toggled)="toggleComment()"
        />
      </div>

      <div class="border-outline-variant flex items-start justify-between gap-4 border-t py-3">
        <div class="min-w-0">
          <label for="notify-status" class="block text-sm font-medium">
            {{ 'settings.emailOnStatus' | t }}
          </label>
          <p class="text-on-surface-variant mt-0.5 text-xs">{{ 'settings.emailOnStatusHint' | t }}</p>
        </div>
        <fh-switch
          inputId="notify-status"
          [checked]="notifyOnStatusChange()"
          [testId]="'account-notify-status'"
          (toggled)="toggleStatusChange()"
        />
      </div>
    </fieldset>

    @if (store.settingsError(); as failure) {
      <p role="alert" data-testid="account-error" class="text-error inline-flex items-center gap-1.5 text-sm">
        <fh-icon name="alert-circle" [size]="16" />
        {{ failure | apiError: 'settings.accountFailed' }}
      </p>
    }
  </div>
</fh-section-card>
