<fh-section-card
  [heading]="'settings.dangerHeading' | t"
  [detail]="'settings.dangerDetail' | t"
  headingId="danger-heading"
  icon="trash"
  tone="danger"
>
  @if (store.deleteError(); as failure) {
    <p role="alert" class="bg-error-container text-on-error-container rounded-lg px-4 py-3 text-sm">
      @if (failure.status === 409) {
        {{ 'settings.deleteLastAdmin' | t }}
      } @else {
        {{ failure | apiError: 'settings.deleteFailed' }}
      }
    </p>
  }

  <div>
    <fh-button variant="danger" [loading]="store.isSaving()" (click)="askToDelete()">
      {{ 'settings.dangerButton' | t }}
    </fh-button>
  </div>
</fh-section-card>
