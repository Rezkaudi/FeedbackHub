<section aria-labelledby="danger-heading" class="border-error rounded-2xl border p-6">
  <h2 id="danger-heading" class="text-error text-lg font-semibold">{{ 'settings.dangerHeading' | t }}</h2>
  <p class="text-on-surface-variant mt-2">{{ 'settings.dangerDetail' | t }}</p>

  @if (store.deleteError()) {
    <p role="alert" class="text-error mt-4 text-sm">
      @if (store.deleteError()?.status === 409) {
        {{ 'settings.deleteLastAdmin' | t }}
      } @else {
        {{ 'settings.deleteFailed' | t }}
      }
    </p>
  }

  <fh-button variant="danger" class="mt-4" [loading]="store.isSaving()" (click)="askToDelete()">
    {{ 'settings.dangerButton' | t }}
  </fh-button>
</section>
