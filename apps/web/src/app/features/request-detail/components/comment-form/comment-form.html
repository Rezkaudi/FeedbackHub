<form class="mt-4" data-testid="comment-form" (submit)="onSubmit($event)">
  <label for="comment-body" class="mb-1 block text-sm font-medium">{{ 'requestDetail.commentFormLabel' | t }}</label>
  <textarea
    id="comment-body"
    rows="3"
    maxlength="2000"
    [value]="draft()"
    (input)="onInput($event)"
    class="fh-textarea"
    data-testid="comment-body"
  ></textarea>

  @if (error(); as failure) {
    <p role="alert" data-testid="comment-form-error" class="text-error mt-2 text-sm">
      {{ failure | apiError: 'requestDetail.commentFailed' }}
    </p>
  }

  <fh-button
    type="submit"
    class="mt-2"
    [loading]="saving()"
    [disabled]="draft().trim().length === 0"
    [testId]="'comment-submit'"
  >
    {{ 'requestDetail.commentSubmit' | t }}
  </fh-button>
</form>
