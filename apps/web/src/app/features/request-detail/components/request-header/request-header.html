<div class="min-w-0 flex-1">
  <h1 class="text-2xl font-semibold">{{ request().title }}</h1>

  <div class="mt-3 flex flex-wrap items-center gap-2">
    @if (status(); as row) {
      <fh-taxonomy-chip [name]="row.name" [color]="row.color" [isActive]="row.isActive" [retiredLabel]="'board.retired' | t" />
    }
    @if (category(); as row) {
      <fh-taxonomy-chip [name]="row.name" [color]="row.color" [isActive]="row.isActive" [retiredLabel]="'board.retired' | t" />
    }
  </div>

  <div class="text-on-surface-variant mt-4 flex items-center gap-2 text-sm">
    <fh-avatar [name]="request().authorName" [src]="request().authorAvatarUrl" [size]="24" />
    <span>{{ request().authorName }}</span>
    <span aria-hidden="true">·</span>
    <time [attr.datetime]="request().createdAt">{{ request().createdAt | localizedDate: { dateStyle: 'medium' } }}</time>
  </div>

  @if (request().isMine || canDelete()) {
    <div class="mt-4 flex items-center gap-2">
      @if (request().isMine) {
        <a
          [routerLink]="['/requests', request().id, 'edit']"
          class="border-outline inline-flex min-h-11 items-center rounded-full border px-4"
        >
          {{ 'common.edit' | t }}
        </a>
      }

      @if (canDelete()) {
        <fh-icon-button
          icon="trash"
          variant="standard"
          [label]="'requestCard.deleteLabel' | t"
          [loading]="deleting()"
          (click)="deleteRequested.emit()"
        />
      }
    </div>
  }
</div>
