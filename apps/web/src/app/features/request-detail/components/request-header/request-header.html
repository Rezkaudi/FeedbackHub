<div class="min-w-0 flex-1">
  <div class="flex items-start justify-between gap-4">
    <h1 class="min-w-0 text-2xl font-semibold tracking-tight text-balance">{{ request().title }}</h1>

    <div class="-mt-1.5 -mr-2 flex flex-none items-center">
      @if (isAdmin()) {
        <fh-icon-button
          icon="pin"
          [pressed]="isPinned()"
          [label]="(isPinned() ? 'requestDetail.unpinFromTop' : 'requestDetail.pinToTop') | t"
          (click)="pinToggled.emit(!isPinned())"
        />
      }

      @if (request().isMine) {
        <a
          [routerLink]="['/requests', request().id, 'edit']"
          [attr.aria-label]="'common.edit' | t"
          class="text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface inline-flex h-11 w-11 items-center justify-center rounded-full transition-colors"
        >
          <fh-icon name="pencil" [size]="20" />
        </a>
      }

      @if (canDelete()) {
        <fh-icon-button
          icon="trash"
          variant="danger"
          [label]="'requestCard.deleteLabel' | t"
          [loading]="deleting()"
          (click)="deleteRequested.emit()"
        />
      }
    </div>
  </div>

  <div class="mt-3 flex flex-wrap items-center gap-2">
    @if (isAdmin()) {
      <fh-status-menu
        [statuses]="statuses()"
        [currentId]="request().statusId"
        (changed)="statusChanged.emit($event)"
      />
    } @else if (status(); as row) {
      <fh-taxonomy-chip [name]="row.name" [color]="row.color" [isActive]="row.isActive" [retiredLabel]="'board.retired' | t" />
    }

    @if (category(); as row) {
      <fh-taxonomy-chip [name]="row.name" [color]="row.color" [isActive]="row.isActive" [retiredLabel]="'board.retired' | t" />
    }
  </div>

  <div class="text-on-surface-variant mt-3 flex items-center gap-2 text-sm">
    <fh-avatar [name]="request().authorName" [src]="request().authorAvatarUrl" [size]="24" />
    <span>{{ request().authorName }}</span>
    <span aria-hidden="true">·</span>
    <time [attr.datetime]="request().createdAt">{{ request().createdAt | localizedDate: { dateStyle: 'medium' } }}</time>
  </div>
</div>
