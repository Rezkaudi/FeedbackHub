<button
  type="button"
  class="request-vote-button"
  data-testid="request-vote"
  [class.voted]="hasVoted()"
  [attr.aria-pressed]="hasVoted()"
  [attr.aria-label]="label()"
  [attr.aria-busy]="busy() ? 'true' : null"
  [disabled]="busy()"
  (click)="voted.emit()"
>
  @if (busy()) {
    <fh-spinner [size]="20" />
  } @else {
    <fh-icon name="arrow-up" [size]="20" />
  }
  <span aria-hidden="true" class="vote-verb">{{ verb() }}</span>
  <span aria-hidden="true">·</span>
  <span aria-hidden="true" class="vote-count" data-testid="request-vote-count">{{ voteCount() }}</span>
</button>
