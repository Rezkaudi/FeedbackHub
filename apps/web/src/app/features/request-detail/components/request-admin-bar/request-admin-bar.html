<div class="bg-surface-container-low border-outline-variant mt-6 flex flex-wrap items-end gap-4 rounded-2xl border p-4">
  <div>
    <label for="admin-status" class="text-on-surface-variant mb-1 block text-sm font-medium">
      {{ 'requestDetail.adminStatusLabel' | t }}
    </label>
    <select id="admin-status" (change)="onStatus($event)" class="fh-select">
      @for (option of statuses(); track option.id) {
        <option [value]="option.id" [selected]="option.id === currentStatusId()">{{ option.name }}</option>
      }
    </select>
  </div>

  <fh-button
    variant="outlined"
    icon="pin"
    [attr.aria-pressed]="isPinned()"
    (click)="pinToggled.emit(!isPinned())"
  >
    {{ (isPinned() ? 'requestDetail.unpinFromTop' : 'requestDetail.pinToTop') | t }}
  </fh-button>

  @if (hasError()) {
    <p role="alert" class="text-error w-full text-sm">{{ 'requestDetail.adminChangeFailed' | t }}</p>
  }
</div>
