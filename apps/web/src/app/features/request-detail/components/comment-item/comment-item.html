<li
  class="border-outline-variant bg-surface rounded-2xl border p-4"
  data-testid="comment-item"
  [attr.data-comment-id]="comment().id"
>
  <div class="flex items-start gap-3">
    <fh-avatar [name]="comment().authorName" [src]="comment().authorAvatarUrl" [size]="32" class="flex-none" />

    <div class="min-w-0 flex-1">
      <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
        <span class="font-medium">{{ comment().authorName }}</span>
        <time
          [attr.datetime]="comment().createdAt"
          class="text-on-surface-variant text-sm"
          [attr.title]="comment().createdAt | localizedDate: { dateStyle: 'long', timeStyle: 'short' }"
        >
          {{ comment().createdAt | relativeTime }}
        </time>
        @if (comment().state === 'pending') {
          <span class="text-warning text-xs font-medium" data-testid="comment-pending">
            · {{ 'requestDetail.commentWaiting' | t }}
          </span>
        }
      </div>

      <p data-user-text data-testid="comment-body-text" class="mt-2 whitespace-pre-wrap wrap-anywhere">
        {{ comment().body }}
      </p>
    </div>

    @if (comment().isMine || canDelete()) {
      <fh-icon-button
        icon="trash"
        variant="standard"
        class="flex-none"
        [label]="deleteLabel()"
        [testId]="'comment-delete'"
        (click)="removed.emit()"
      />
    }
  </div>
</li>
