<div class="board-sort">
  <fh-icon name="arrow-up-down" [size]="18" class="board-sort-icon" />
  <label for="board-sort" class="sr-only">{{ 'board.sortLabel' | t }}</label>
  <select id="board-sort" (change)="onChange($event)" class="board-sort-select">
    @for (option of options; track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">{{ option.labelKey | t }}</option>
    }
  </select>
  <fh-icon name="chevron-down" [size]="18" class="board-sort-chevron" />
</div>
