@if (tags().length > 0) {
  <div class="active-filters">
    @for (tag of tags(); track tag.label) {
      <button type="button" class="active-filter-chip" (click)="tag.remove()">
        <span>{{ tag.label }}</span>
        <fh-icon name="close" [size]="14" />
      </button>
    }

    <button type="button" class="active-filters-clear" (click)="clearedAll.emit()">
      {{ 'board.clearAll' | t }}
    </button>
  </div>
}
