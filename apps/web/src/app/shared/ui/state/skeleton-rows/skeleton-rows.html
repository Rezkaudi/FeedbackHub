<p role="status" class="sr-only">{{ label() }}</p>
<div aria-hidden="true" class="skeleton-grid">
  @for (row of rows(); track row) {
    <div class="skeleton-card">
      <div class="line w-1/3"></div>
      <div class="line w-full h-5 mt-3"></div>
      <div class="line w-2/3 h-3 mt-2"></div>
      <div class="line w-full h-3 mt-4"></div>
      <div class="line w-4/5 h-3 mt-2"></div>
    </div>
  }
</div>
