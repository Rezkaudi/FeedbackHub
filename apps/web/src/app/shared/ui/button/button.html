<button
  [type]="type()"
  class="fh-button"
  [class]="'variant-' + variant()"
  [class.size-sm]="size() === 'sm'"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (loading()) {
    <fh-spinner [size]="16" />
  } @else if (icon(); as name) {
    <fh-icon [name]="name" [size]="18" />
  }
  <span class="label"><ng-content /></span>
</button>
