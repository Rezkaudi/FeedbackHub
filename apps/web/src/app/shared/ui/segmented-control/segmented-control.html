<div class="fh-segmented" role="radiogroup" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      class="fh-segmented-item"
      [class.icon-only]="!!option.icon"
      [class.selected]="option.value === value()"
      [attr.aria-checked]="option.value === value()"
      [attr.aria-label]="option.srLabel ?? (option.icon ? option.label : null)"
      [title]="option.srLabel ?? option.label"
      (click)="select(option.value)"
    >
      @if (option.icon; as name) {
        <fh-icon [name]="name" [size]="18" />
      }
      @if (!option.icon) {
        <span>{{ option.label }}</span>
      }
    </button>
  }
</div>
