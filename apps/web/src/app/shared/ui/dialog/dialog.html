<dialog
  [class]="'size-' + size()"
  [attr.role]="role()"
  [attr.aria-labelledby]="labelId()"
  [attr.data-testid]="testId() ?? null"
  (cancel)="onCancel($event)"
  (click)="closed.emit()"
>
  <div class="surface" (click)="$event.stopPropagation()">
    <header class="dialog-header">
      @if (heading()) {
        <h2 class="dialog-title" [id]="titleId">{{ heading() }}</h2>
      }
      @if (!hideCloseButton()) {
        <fh-icon-button icon="close" [label]="closeLabel()" [testId]="closeTestId()" (click)="closed.emit()" />
      }
    </header>
    <div class="dialog-body">
      <ng-content />
    </div>
  </div>
</dialog>
