<label class="filter-chip" [class.checked]="checked()">
  <input
    type="checkbox"
    [id]="inputId()"
    class="sr-only"
    [checked]="checked()"
    [attr.data-testid]="testId() ?? null"
    (change)="toggled.emit()"
  />
  @if (checked()) {
    <fh-icon name="check" [size]="16" />
  }
  <span><ng-content /></span>
</label>
